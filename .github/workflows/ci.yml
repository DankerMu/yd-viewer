name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  producer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Enforce tracked-file line limit
        run: uv run python ../scripts/large_file_guard.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  viewer-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: bash tests/test_entrypoint.sh

  viewer-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install -g @fission-ai/openspec@1.3.1
      - run: openspec validate --all

  stage-pipeline-log:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Touched OpenSpec changes must be covered by stage-pipeline-log
        run: bash scripts/check-stage-pipeline-log.sh "origin/${{ github.base_ref }}"
