[project]
name = "yd-producer"
version = "0.1.0"
description = "yd basin SHUD forecast producer: node-22 compute loop (IFS/GFS dual-source)"
requires-python = ">=3.12"
dependencies = [
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yd_producer"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
