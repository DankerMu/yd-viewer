[project]
name = "yd-producer"
version = "0.1.0"
description = "yd basin SHUD forecast producer: node-22 compute loop (IFS/GFS dual-source)"
requires-python = ">=3.12"
dependencies = [
    "cfgrib>=0.9",
    "eccodeslib>=2.48",
    "netCDF4>=1.7",
    "numpy>=2",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "shapely>=2.1.2",
    "xarray>=2025.1",
]

[project.scripts]
yd-producer = "yd_producer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yd_producer"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# NWM@8ae9b8f2 快照文件逐字承接 pin 的 lint 基线（ruff 0.16 默认规则集较 pin 时点扩面）。
# 只对清单 §1 登记的快照目标生效，yd 自撰代码不豁免。
"src/yd_producer/canonical/converter.py" = ["BLE001", "C409", "TRY201"]
"tests/test_canonical_converter.py" = ["RUF012", "RUF015"]
"src/yd_producer/forcing/producer.py" = [
    "B023",
    "BLE001",
    "F401",
    "F841",
    "FURB192",
    "I001",
    "RUF046",
    "SIM103",
    "UP035",
]
"src/yd_producer/forcing/file_store.py" = ["BLE001", "F401", "I001", "PIE810"]
"tests/test_forcing_producer.py" = ["F401", "FLY002", "RUF034"]
