[project]
name = "yd-viewer-backend"
version = "0.1.0"
description = "yd basin forecast viewer backend: read-only FastAPI over YD_ROOT products"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    # Starlette TestClient prefers httpx2; this replaces #243's httpx.
    "httpx2>=2.13,<3",
    # Temporary: Starlette still uses deprecated anyio.abc.BlockingPortal (AnyIO 4.15+).
    # Remove after Starlette drops that alias and a compatibility matrix is green.
    # Shared uv.lock also freezes runtime AnyIO at 4.14.2 (approved).
    "anyio<4.15",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yd_viewer"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
